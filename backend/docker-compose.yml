services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_agenda_db
    restart: always
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-AGENDA}
      APP_USER: ${DB_USERNAME}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data:
