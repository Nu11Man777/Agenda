name: CI

# Trigger: pushes to main, and pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend (Java / Spring Boot / Gradle) ──────────────────────────────────
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: ./gradlew dependencies --no-daemon

      - name: Run test suite
        run: ./gradlew test --no-daemon

      - name: Syntax / lint check (compile main sources)
        run: ./gradlew compileJava --no-daemon

      - name: Report backend result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Backend: build, dependency install, and compilation succeeded."
          else
            echo "❌ Backend: one or more steps failed. See logs above."
          fi

  # ── Frontend (React / Vite) ────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test --if-present

      - name: Syntax / lint check
        run: npm run lint

      - name: Report frontend result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Frontend: dependency install, tests, and lint succeeded."
          else
            echo "❌ Frontend: one or more steps failed. See logs above."
          fi

  # ── Overall result ──────────────────────────────────────────────────────────
  report:
    name: Report CI result
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Summarize
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "## ✅ CI passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "## ❌ CI failed" >> "$GITHUB_STEP_SUMMARY"
            echo "backend: ${{ needs.backend.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "frontend: ${{ needs.frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
